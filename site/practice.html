<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lattice — Practice</title>
  <script>
    (function () {
      const saved = localStorage.getItem("putnam_theme_v1");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script defer src="generators.js"></script>
  <script defer src="practice.js"></script>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <main class="container">
    <header class="hero">
      <div class="brand">
        <img class="brand-mark" src="favicon.svg" alt="" width="44" height="44" />
        <div>
          <h1>Practice</h1>
          <p class="tagline">Generated drills, levelled.</p>
        </div>
      </div>
      <p><a class="nav-link" href="index.html">← Problem bank</a> &nbsp; <a class="nav-link" href="graph.html">The graph →</a></p>
    </header>

    <section id="skillGrid" class="skill-grid"></section>

    <section id="drill" class="drill" hidden>
      <div class="drill-head">
        <button id="drillBack" class="ghost-btn" type="button">← All skills</button>
        <span id="drillName" class="drill-name"></span>
        <span id="drillLevel" class="level-chip"></span>
        <span id="drillStreak" class="streak"></span>
      </div>
      <div class="level-track"><span id="levelFill" class="level-fill"></span></div>
      <p id="prompt" class="drill-prompt"></p>
      <form id="answerForm" class="answer-row" autocomplete="off">
        <input id="answer" type="text" inputmode="text" placeholder="Answer" aria-label="Answer" />
        <button type="submit" class="grade">Check</button>
        <button id="skipBtn" type="button" class="ghost-btn">Skip</button>
        <button id="showBtn" type="button" class="ghost-btn">Show me</button>
      </form>
      <div id="feedback" class="feedback"></div>
      <div id="work" class="work" hidden></div>
      <p id="trick" class="trick"></p>
    </section>
  </main>
</body>
</html>
