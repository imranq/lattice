<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lattice — Problems</title>
  <script>
    (function () {
      const saved = localStorage.getItem("putnam_theme_v1");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]],
             processEscapes: true },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="problems-page.js"></script>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <main class="container">
    <header class="hero">
      <div class="brand">
        <img class="brand-mark" src="favicon.svg" alt="" width="44" height="44" />
        <div>
          <h1>Problems</h1>
          <p class="tagline" id="tagline">Every exercise in the graph.</p>
        </div>
      </div>
      <p class="nav-row">
        <a class="nav-link" href="graph.html">The graph →</a>
        <a class="nav-link" href="practice.html">Practice drills →</a>
        <a class="nav-link" href="progress.html">Progress →</a>
        <a class="nav-link" href="index.html">Putnam bank →</a>
      </p>
    </header>

    <section class="filters">
      <input id="q" type="search" placeholder="Search problem text…" />
      <select id="domain"><option value="">All domains</option></select>
      <select id="book"><option value="">All books</option></select>
      <select id="tier">
        <option value="">All tiers</option>
        <option value="W1">W1 — warm-up</option>
        <option value="W2">W2 — bridge</option>
        <option value="core">core</option>
      </select>
      <select id="sort">
        <option value="">Book order</option>
        <option value="easy">Easiest first</option>
        <option value="hard">Hardest first</option>
      </select>
      <label class="toggle"><input id="unsolved" type="checkbox" /><span>Unsolved only</span></label>
      <label class="toggle"><input id="garbled" type="checkbox" /><span>Include unreadable</span></label>
      <span id="garbledNote" class="dim"></span>
      <span id="count" class="graph-count"></span>
    </section>

    <section id="list" class="problem-feed"></section>
    <div class="feed-foot">
      <button id="more" class="ghost-btn" type="button" hidden>Load more</button>
      <span id="footNote" class="dim"></span>
    </div>
  </main>
</body>
</html>
