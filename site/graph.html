<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lattice — Graph</title>
  <script>
    (function () {
      const saved = localStorage.getItem("putnam_theme_v1");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script defer src="graph.js"></script>
</head>
<body>
  <main class="container graph-page">
    <header class="hero">
      <div class="brand">
        <img class="brand-mark" src="favicon.svg" alt="" width="44" height="44" />
        <div>
          <h1>The graph</h1>
          <p class="tagline">Concepts, partially ordered.</p>
        </div>
      </div>
      <p>
        <a class="nav-link" href="index.html">← Problem bank</a>
        <a class="nav-link" href="practice.html">Practice drills →</a>
      </p>
    </header>

    <section class="graph-controls">
      <label class="toggle"><input type="checkbox" id="showMastery" checked /><span>Colour by mastery</span></label>
      <label class="toggle"><input type="checkbox" id="showLabels" checked /><span>Labels</span></label>
      <select id="domainFilter" aria-label="Filter by domain"><option value="">All domains</option></select>
      <input id="graphSearch" type="search" placeholder="Find a concept" />
      <span id="graphCount" class="graph-count"></span>
      <button id="replay" class="ghost-btn" type="button">Fit to screen</button>
    </section>

    <section class="graph-stage">
      <canvas id="canvas"></canvas>
      <aside id="inspector" class="inspector" hidden></aside>
      <div class="graph-legend" id="legend"></div>
    </section>
  </main>
</body>
</html>
