<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lattice">
  <defs>
    <linearGradient id="lat-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d05b2d"/>
      <stop offset="1" stop-color="#9c3c17"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#lat-bg)"/>
  <!-- A Hasse diagram of the diamond lattice: the prerequisite order, drawn.
       Edges ascend from the bottom element through two incomparable concepts
       to the top - which is the warm-up ladder and the graph in one mark. -->
  <g stroke="#f6f2e8" stroke-width="3" stroke-linecap="round" opacity="0.72">
    <path d="M32 49 L17 33"/>
    <path d="M32 49 L47 33"/>
    <path d="M17 33 L32 16"/>
    <path d="M47 33 L32 16"/>
  </g>
  <circle cx="32" cy="49" r="5.2" fill="#f6f2e8"/>
  <circle cx="17" cy="33" r="5.2" fill="#f6f2e8"/>
  <circle cx="47" cy="33" r="5.2" fill="#f6f2e8"/>
  <!-- top element: the target problem you are climbing to -->
  <circle cx="32" cy="16" r="5.8" fill="#6ec7c2"/>
</svg>
