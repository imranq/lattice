<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lattice</title>
  <script>
    (function () {
      const saved = localStorage.getItem("putnam_theme_v1");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]],
             processEscapes: true },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="app-shell.js"></script>
  <script defer src="generators.js"></script>
  <script defer src="graph.js"></script>
  <script defer src="study.js"></script>
  <script defer src="home.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Lattice home">
      <img class="brand-mark" src="favicon.svg" alt="" width="30" height="30" />
      <span><strong>Lattice</strong><small>Concepts, partially ordered</small></span>
    </a>
    <nav aria-label="Primary">
      <button data-view="home" class="nav-button active">Home</button>
      <button data-view="study" class="nav-button">Study</button>
      <button data-view="explore" class="nav-button">Graph</button>
    </nav>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">☾</button>
  </header>

  <main>
    <!-- ============ Home ============ -->
    <section id="home" class="view active">
      <div class="home-grid">
        <div class="home-main">
          <section class="stat-row" id="homeStats"></section>
          <section class="panel" id="homePlan"></section>
          <div id="homeDeep"></div>
        </div>
        <aside class="home-side">
          <section class="panel map-panel">
            <div class="panel-heading">
              <div><p class="eyebrow">THE GRAPH</p><h2>Where you are</h2></div>
              <a class="link-btn" href="#explore">open</a>
            </div>
            <canvas id="miniCanvas" class="mini-canvas"></canvas>
            <div id="miniLegend" class="legend-stack"></div>
          </section>
          <section class="panel" id="homeWeak"></section>
        </aside>
      </div>
    </section>

    <!-- ============ Study ============ -->
    <section id="study" class="view">
      <div class="study-grid">
        <aside class="sidebar">
          <div id="sideStudy" class="side-section">
            <div class="seg" role="group" aria-label="Session mode">
              <button type="button" class="active" data-mode="practice">Practice</button>
              <button type="button" data-mode="test">Test</button>
            </div>

            <div id="testSettings" class="test-settings" hidden>
              <p class="field-label">Questions</p>
              <div class="seg seg-sm" role="group" aria-label="Test length">
                <button type="button" data-len="5">5</button>
                <button type="button" class="active" data-len="10">10</button>
                <button type="button" data-len="20">20</button>
              </div>
            </div>

            <div class="field">
              <p class="field-label">Fields <button type="button" class="link-btn" data-all="domain">all</button></p>
              <div id="domainChips" class="chips"></div>
            </div>

            <div class="field">
              <p class="field-label">Sources</p>
              <div id="sourceChips" class="chips">
                <button type="button" class="chip-toggle on" data-src="textbook">Textbooks</button>
                <button type="button" class="chip-toggle on" data-src="contest">Putnam</button>
                <button type="button" class="chip-toggle on" data-src="generated">Drills</button>
              </div>
            </div>

            <button id="generateBtn" class="btn-primary btn-block">Generate question</button>

            <div class="session-mini">
              <span><b id="sessSolved">0</b> solved</span>
              <span><b id="sessSeen">0</b> attempted</span>
            </div>

            <div id="abilityBox" class="ability-box"></div>
            <p class="shortcut-note"><kbd>Enter</kbd> submit · <kbd>G</kbd> new question</p>
          </div>
        </aside>
        <div id="studyRoot"></div>
      </div>
    </section>

    <!-- ============ Graph ============ -->
    <section id="explore" class="view">
      <div class="graph-stage">
        <canvas id="canvas"></canvas>
        <div class="graph-overlay graph-controls-overlay">
          <input id="graphSearch" type="search" placeholder="Find a concept" />
          <select id="domainFilter" aria-label="Filter by domain"><option value="">All domains</option></select>
          <label class="toggle"><input type="checkbox" id="showMastery" checked /><span>Mastery</span></label>
          <label class="toggle"><input type="checkbox" id="showLabels" checked /><span>Labels</span></label>
          <button id="replay" class="ghost-btn" type="button">Fit</button>
        </div>
        <details class="graph-overlay graph-legend-overlay">
          <summary id="graphCount" class="data-count"></summary>
          <div id="legend" class="legend-stack"></div>
        </details>
        <aside id="inspector" class="inspector" hidden></aside>
      </div>
    </section>
  </main>

</body>
</html>
