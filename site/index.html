<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lattice</title>
  <script>
    (function () {
      const saved = localStorage.getItem("putnam_theme_v1");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]],
             processEscapes: true },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="app-shell.js"></script>
  <script defer src="generators.js"></script>
  <script defer src="graph.js"></script>
  <script defer src="study.js"></script>
  <script defer src="progress.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#study" aria-label="Lattice home">
        <img class="brand-mark" src="favicon.svg" alt="" width="34" height="34" />
        <span><strong>Lattice</strong><small>Concepts, partially ordered</small></span>
      </a>

      <nav aria-label="Primary">
        <button data-view="study" class="nav-button active">Study</button>
        <button data-view="explore" class="nav-button">Graph</button>
        <button data-view="progress" class="nav-button">Stats</button>
      </nav>

      <div id="sideStudy" class="side-section">
        <p class="eyebrow">Field</p>
        <select id="studyDomain" aria-label="Field"><option value="">All fields</option></select>

        <p class="eyebrow">Sources</p>
        <label class="toggle"><input type="checkbox" id="srcTextbook" checked /><span>Textbooks</span></label>
        <label class="toggle"><input type="checkbox" id="srcContest" checked /><span>Putnam</span></label>
        <label class="toggle"><input type="checkbox" id="srcGenerated" checked /><span>Generated drills</span></label>

        <p class="eyebrow">Your level</p>
        <div id="abilityBox" class="ability-box"></div>

        <p class="eyebrow">Up next</p>
        <ol id="queuePreview" class="queue-preview"></ol>
      </div>

      <div id="sideGraph" class="side-section" hidden>
        <p class="eyebrow">Display</p>
        <label class="toggle"><input type="checkbox" id="showMastery" checked /><span>Colour by mastery</span></label>
        <label class="toggle"><input type="checkbox" id="showLabels" checked /><span>Labels</span></label>
        <p class="eyebrow">Filter</p>
        <select id="domainFilter" aria-label="Filter by domain"><option value="">All domains</option></select>
        <input id="graphSearch" type="search" placeholder="Find a concept" />
        <button id="replay" class="ghost-btn" type="button">Fit to screen</button>
        <p class="eyebrow">Legend</p>
        <div id="legend" class="legend-stack"></div>
        <p id="graphCount" class="data-count"></p>
      </div>

      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">☾</button>
    </aside>

    <main>
      <section id="study" class="view active">
        <div id="studyRoot"></div>
      </section>

      <section id="explore" class="view">
        <div class="graph-stage"><canvas id="canvas"></canvas></div>
        <aside id="inspector" class="inspector" hidden></aside>
      </section>

      <section id="progress" class="view">
        <div id="content" class="progress-content"></div>
      </section>
    </main>
  </div>
</body>
</html>
