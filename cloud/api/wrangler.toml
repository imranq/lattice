name = "lattice-api"
main = "worker.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# Reached only through the Pages project's service binding.
workers_dev = false
preview_urls = false

[assets]
# Built by cloud/build.mjs: the graph, Putnam hints and solutions, and ladders.
directory = "assets"
binding = "ASSETS"

[vars]
LATTICE_URL = "https://lattice-app.pages.dev"

[[durable_objects.bindings]]
name = "LEARNER"
class_name = "Learner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Learner"]

[observability]
enabled = true
